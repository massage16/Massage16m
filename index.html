<script>

let base = 6000;

service.onchange = () => {

calc();
};

promo.oninput = calc;

function calc(){
let code = promo.value.trim();
let price = base;

if(code === "mn16" && base === 10000){
price = 8000;
}

document.getElementById("price").innerText = price;
}

setInterval(()=>{

if(v<120) v=120;
if(v>260) v=260;

},4000);

bookings.innerText=parseInt(bookings.innerText)+1;
