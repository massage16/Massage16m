<script>

let base = 8000;

const service = document.getElementById("service");

const promo = document.getElementById("promo");

service.onchange = () => {

base = parseInt(service.value);

calc();

};

promo.addEventListener("input", calc);

function calc(){

let finalPrice = base;

let code = promo.value.trim();

if(code === "Malak97" && base ===16000){

finalPrice = 11000;

}

document.getElementById("price").innerText = finalPrice;

}

setInterval(()=>{

let el = document.getElementById("online");

let v = parseInt(el.innerText);

v += Math.floor(Math.random()*5)-2;

if(v < 120) v = 120;

if(v > 260) v = 260;

el.innerText = v;

},4000);

setInterval(()=>{

let bookings = document.getElementById("bookings");

bookings.innerText = parseInt(bookings.innerText)+1;

},10000);

const token = "8746466394:AAGypQv2KmLBYmlRYkO_hsFWiY7_REGFWHE";

const chat_id = "8735699172";

document.getElementById("form").addEventListener("submit", async function(e){

e.preventDefault();

let name = document.getElementById("name").value;

let phone = document.getElementById("phone").value;

let wilaya = document.getElementById("wilaya").value;

let serviceText =
document.getElementById("service").selectedOptions[0].text;

let price =
document.getElementById("price").innerText;

let promoCode =
promo.value || "لا يوجد";

let text =

`طلب جديد

الاسم: ${name}

الهاتف: ${phone}

الولاية: ${wilaya}

الخدمة: ${serviceText}

البرومو: ${promoCode}

السعر النهائي: ${price} دج`;

try{

await fetch(

`https://api.telegram.org/bot${token}/sendMessage`,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

chat_id:chat_id,

text:text

})

}

);

let file =
document.getElementById("receipt").files[0];

if(file){

let formData = new FormData();

formData.append("chat_id", chat_id);

formData.append("photo", file);

formData.append("caption", text);

await fetch(

`https://api.telegram.org/bot${token}/sendPhoto`,

{

method:"POST",

body:formData

}

);

}

alert("تم إرسال الطلب بنجاح");

document.getElementById("form").reset();

document.getElementById("price").innerText = "8000";

}
catch(error){

alert("حدث خطأ أثناء الإرسال");

console.log(error);

}

});

</script>
