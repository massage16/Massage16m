<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خدمات سبا VIP</title>

<style>
body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

.container{
max-width:420px;
margin:30px auto;
background:#1b1b1b;
padding:20px;
border-radius:15px;
border:1px solid #333;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2b2b2b;
color:white;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
background:#00c46a;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.price{
margin-top:15px;
padding:12px;
background:#111;
border-radius:10px;
text-align:center;
font-size:20px;
color:#00ff99;
}

.notice{
margin-top:10px;
padding:10px;
background:#003d1f;
border-radius:10px;
text-align:center;
font-size:13px;
color:#8cffc1;
}
</style>

</head>

<body>

<div class="container">

<form id="form">
